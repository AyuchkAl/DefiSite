<svg width="420" height="260" viewBox="0 0 420 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(17,21,42,0.95)"/>
      <stop offset="1" stop-color="rgba(12,16,35,0.92)"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title{ font: 700 14px system-ui, -apple-system, Segoe UI, sans-serif; fill: rgba(245,245,245,0.92); }
      .sub{ font: 600 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: rgba(207,213,255,0.9); }
      .val{ font: 800 28px system-ui, -apple-system, Segoe UI, sans-serif; fill: #fff; }
      .lbl{ font: 600 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: rgba(245,245,245,0.85); }
      .dot{ r: 6; }
    </style>
  </defs>

  <rect x="10" y="10" width="400" height="240" rx="18" fill="url(#bg)" stroke="rgba(255,255,255,0.06)"/>

  <text x="28" y="42" class="title">Assets Allocation</text>
  <text x="28" y="62" class="sub">BTC / ETH / USDC</text>

  <!-- Donut track -->
  <circle cx="150" cy="150" r="62" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="18"/>

  <!-- circumference ≈ 389.56 -->
  <!-- BTC 34% => 132.45 -->
  <circle cx="150" cy="150" r="62" fill="none" stroke="#f5d547" stroke-width="18"
          stroke-linecap="round" transform="rotate(-90 150 150)"
          stroke-dasharray="132.45 389.56" stroke-dashoffset="0" filter="url(#glow)"/>
  <!-- ETH 42% => 163.62 -->
  <circle cx="150" cy="150" r="62" fill="none" stroke="#2ebac6" stroke-width="18"
          stroke-linecap="round" transform="rotate(-90 150 150)"
          stroke-dasharray="163.62 389.56" stroke-dashoffset="-142.45" filter="url(#glow)"/>
  <!-- USDC 24% => 93.49 -->
  <circle cx="150" cy="150" r="62" fill="none" stroke="#16c784" stroke-width="18"
          stroke-linecap="round" transform="rotate(-90 150 150)"
          stroke-dasharray="93.49 389.56" stroke-dashoffset="-316.07" filter="url(#glow)"/>

  <text x="150" y="145" text-anchor="middle" class="val">100%</text>
  <text x="150" y="168" text-anchor="middle" class="sub">Allocation</text>

  <circle cx="260" cy="110" class="dot" fill="#f5d547"/>
  <text x="275" y="114" class="lbl">BTC</text>
  <text x="350" y="114" class="lbl" text-anchor="end">34%</text>

  <circle cx="260" cy="145" class="dot" fill="#2ebac6"/>
  <text x="275" y="149" class="lbl">ETH</text>
  <text x="350" y="149" class="lbl" text-anchor="end">42%</text>

  <circle cx="260" cy="180" class="dot" fill="#16c784"/>
  <text x="275" y="184" class="lbl">USDC</text>
  <text x="350" y="184" class="lbl" text-anchor="end">24%</text>
</svg>